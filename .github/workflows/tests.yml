name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # Laravel versions that run on PHP 8.0/8.1 are blocked by security advisories,
      # so Testbench is only installed from PHP 8.2. Only the core suite runs there.
      - name: Skip Laravel test tooling on PHP < 8.2
        if: matrix.php == '8.0' || matrix.php == '8.1'
        run: composer remove --dev orchestra/testbench --no-update
      - run: composer update --prefer-dist --no-interaction --no-progress
      - name: Tests (core + Laravel)
        if: matrix.php != '8.0' && matrix.php != '8.1'
        run: vendor/bin/phpunit
      - name: Tests (core only)
        if: matrix.php == '8.0' || matrix.php == '8.1'
        run: vendor/bin/phpunit --testsuite core

  quality:
    runs-on: ubuntu-latest
    name: Static analysis & style
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  widget:
    runs-on: ubuntu-latest
    name: Widget syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check resources/dist/ai-chat-widget.js
